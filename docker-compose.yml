services:
  # MySQL 8.0
  profit-mysql:
    image: mysql:8.0
    container_name: profit-mysql
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: jeecg-boot
      TZ: Asia/Shanghai
    volumes:
      - profit-mysql-data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    networks:
      - profit-network

  # Redis 6.0（使用现有的或启动新的）
  profit-redis:
    image: redis:6.0-alpine
    container_name: profit-redis
    restart: always
    ports:
      - "6379:6379"  # 使用 6380 避免冲突
    command: redis-server --appendonly yes
    volumes:
      - profit-redis-data:/data
    networks:
      - profit-network

  # 后端本地启动，勿在此编排镜像；见 backend/jeecg-boot/jeecg-boot 与 application-dev.yml

volumes:
  profit-mysql-data:
  profit-redis-data:

networks:
  profit-network:
    driver: bridge
