spring:
  application:
    name: profit-decision-system
  profiles:
    active: dev
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: '0'

server:
  port: 8080
  compression:
    enabled: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false

logging:
  level:
    root: info

app:
  auth:
    username: admin
    password: 123456
    display-name: 管理员
    token-ttl-minutes: 720
